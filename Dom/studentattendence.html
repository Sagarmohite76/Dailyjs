<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Management System</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background-color: #f4f6f8;
        }

        header {
            background-color: #2c3e50;
            color: white;
            padding: 15px;
            text-align: center;
        }

        .container {
            width: 90%;
            margin: 30px auto;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }

        .form-box, .table-box {
            background: white;
            padding: 20px;
            border-radius: 6px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h2 {
            margin-bottom: 15px;
            color: #2c3e50;
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
        }

        button {
            margin-top: 15px;
            padding: 10px;
            width: 100%;
            background-color: #2c3e50;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #34495e;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #2c3e50;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<header>
    <h1>Student Management System</h1>
</header>

<div class="container">

    <!-- Student Form -->
    <div class="form-box">
        <h2>Add Student</h2>

        <label>Student Name</label>
        <input type="text" placeholder="Enter name">

        <label>Roll Number</label>
        <input type="text" placeholder="Enter roll no">

        <label>Class</label>
        <input type="text" placeholder="Enter class">

        <label>Email</label>
        <input type="email" placeholder="Enter email">

        <button>Add Student</button>
    </div>

    <!-- Student Table -->
    <div class="table-box">
        <h2>Student List</h2>

        <table>
            <tr>
                <th>Roll No</th>
                <th>Name</th>
                <th>Class</th>
                <th>Email</th>
            </tr>
            <tr>
                <td>01</td>
                <td>Rahul Sharma</td>
                <td>10th</td>
                <td>rahul@gmail.com</td>
            </tr>
            <tr>
                <td>02</td>
                <td>Anita Patil</td>
                <td>9th</td>
                <td>anita@gmail.com</td>
            </tr>
        </table>
    </div>

</div>

</body>
</html>
